name: Futbol Veri Otomasyonu

on:
  # Her Pazartesi saat 03:00'te otomatik çalışır (İstediğiniz zamanı değiştirebilirsiniz)
  schedule:
    - cron: '0 3 * * 1'
  
  # İsterseniz GitHub panelinden tek tıkla manuel de çalıştırabilirsiniz
  workflow_dispatch:

jobs:
  run-scraper:
  runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests cloudscraper beautifulsoup4 supabase python-dotenv lxml

      - name: Scraper Scriptini Çalıştır
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python fbref_scraper.py
